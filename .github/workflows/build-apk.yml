name: Build Apex AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # The ubuntu runner ships the Android SDK. We only verify platform 34 is
      # present and install it if the image changes — no third-party setup action,
      # which is what broke the first build.
      - name: Resolve Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk root: $SDK_ROOT"
          SDKMGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -n "$SDKMGR" ] && [ ! -d "$SDK_ROOT/platforms/android-34" ]; then
            echo "installing platform 34"
            yes | "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "platforms:"; ls "$SDK_ROOT/platforms" || true
          echo "build-tools:"; ls "$SDK_ROOT/build-tools" || true

      - name: Ensure NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -n "$SDKMGR" ]; then
            if [ ! -d "$SDK_ROOT/ndk" ] || [ -z "$(ls -A "$SDK_ROOT/ndk" 2>/dev/null)" ]; then
              yes | "$SDKMGR" "ndk;26.1.10909125" > /dev/null 2>&1 || true
            fi
            if [ ! -d "$SDK_ROOT/cmake" ] || [ -z "$(ls -A "$SDK_ROOT/cmake" 2>/dev/null)" ]; then
              yes | "$SDKMGR" "cmake;3.22.1" > /dev/null 2>&1 || true
            fi
          fi
          echo "ndk:"; ls "$SDK_ROOT/ndk" || true
          echo "cmake:"; ls "$SDK_ROOT/cmake" || true

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/apex-release.jks" \
            -storepass apexrelease -keypass apexrelease \
            -alias apex -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Apex AI, OU=Engineering, O=Apex, L=Bengaluru, S=Karnataka, C=IN"

      - name: Unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Test summary
        if: always()
        run: |
          echo "unit test results"
          find app/build/test-results -name "TEST-*.xml" -print0 2>/dev/null \
            | xargs -0 -r grep -h "<testsuite " \
            | sed -E 's/.*name="([^"]+)".*tests="([0-9]+)".*failures="([0-9]+)".*errors="([0-9]+)".*/\1  tests=\2 failures=\3 errors=\4/' \
            || echo "no test results found"

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        env:
          APEX_KEYSTORE: ${{ runner.temp }}/apex-release.jks
          APEX_STORE_PASS: apexrelease
          APEX_KEY_ALIAS: apex
          APEX_KEY_PASS: apexrelease
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apex-ai-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
